{% extends "based/base.html" %}
{% block title %}Бронювання кімнати{% endblock %}

{% block content %}
<div class="container py-4 d-flex justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 600px; width: 100%;">
        <h2 class="text-center mb-4">Бронювання кімнати</h2>

        <h4 class="text-center text-muted mb-3">{{ room.name }}</h4>
        
        <p class="text-center mb-4">
            <span class="fw-bold text-success">Ціна за годину:</span>
            <span class="fs-5">{{ room.price_for_hour }} $</span>
        </p>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="d-grid">
                <button type="submit" class="btn btn-primary mt-3">Забронювати</button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="{% url 'room_list' %}" class="btn btn-secondary">← На головну сторінку</a>
        </div>
    </div>
</div>
{% endblock %}
