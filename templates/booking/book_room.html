<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking room</title>
</head>
<body>
    <h1>Бронювання кімнати: {{ room.name }}</h1>
    <p>Ціна за годину: {{ room.price_for_hour }} $</p>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Забронювати</button>
    </form>
</body>
</html>
