{% extends "based/base.html" %}
{% block title %}Бронювання кімнати{% endblock %}

{% block content %}
    <h1>Бронювання кімнати: {{ room.name }}</h1>    
    <div class="card mb-2 p-2">
        <p>Ціна за годину: {{ room.price_for_hour }} $</p>
        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
        <button type="submit">Забронювати</button>
        </form>
    </div>
    
{% endblock %}
