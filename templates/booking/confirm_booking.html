{% extends "based/base.html" %}
{% block title %}Підтвердження бронювання{% endblock %}

{% block content %}
<div class="container py-4 d-flex justify-content-center">
    <div class="card shadow-lg p-4" style="max-width: 600px; width: 100%;">
        <h2 class="text-center mb-4">Підтвердження бронювання</h2>
        <p class="text-center mb-4">Код підтвердження надіслано на вашу пошту: <strong>{{ request.user.email }}</strong></p>

        <form method="post" class="mb-3">
            {% csrf_token %}
            {{ form.code.label_tag }}
            {{ form.code }}
            <button type="submit" class="btn btn-primary mt-3 w-100">Підтвердити</button>
        </form>
    </div>
</div>
{% endblock %}
