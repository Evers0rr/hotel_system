{% extends 'based/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<div class="container d-flex justify-content-center">
    <div class="card p-4 shadow-sm" style="width: 400px;">
        <h2 class="text-center mb-3">Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Зареєструватися</button>
        </form>
        <p class="text-center mt-3">Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
        <a href="{% url 'room_list' %}" class="btn btn-secondary mt-2 w-100">← Повернутися на головну</a>
    </div>
</div>
{% endblock %}
