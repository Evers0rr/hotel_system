{% extends 'based/base.html' %}
{% load crispy_forms_tags %}

{% block title %}Реєстрація{% endblock %}

{% block content %}
<nav class="navbar navbar-expand-lg bg-primary border rounded shadow-sm mt-3">
    <div class="container-fluid px-4">
        <a class="navbar-brand fw-bold text-dark" href="{% url 'home' %}">🏨 Головна</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
    </div>
</nav>
<div class="container d-flex justify-content-center">
    <div class="card p-4 shadow-sm" style="width: 400px;">
        <h2 class="text-center mb-3">Реєстрація</h2>
        <form method="post">
            {% csrf_token %}
            {{ form|crispy }}
            <button type="submit" class="btn btn-primary w-100 mt-3">Зареєструватися</button>
        </form>
        <p class="text-center mt-3">Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></p>
    </div>
</div>
{% endblock %}
