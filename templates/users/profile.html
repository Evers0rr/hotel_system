{% extends "based/base.html" %}

{% block title %}Вхід{% endblock %}
{% block content %}
    <h1>Профіль {{ user.username }}</h1>
    <p>Email: {{ user.email }}</p>
    <p>Адреса: {{ user.profile.address }}</p>
    <form method="post" action="{% url 'logout' %}">
        {% csrf_token %}
        <button type="submit">Вийти</button>
      </form>
{% endblock %}
